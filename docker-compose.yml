services:
  postgres:
    image: postgres:17
    container_name: morpholoom-postgres
    environment:
      POSTGRES_DB: morpholoom
      POSTGRES_USER: morpholoom
      POSTGRES_PASSWORD: morpholoom123!
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U morpholoom"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - morpholoom-network

  morpholoom:
    build:
      context: ./Morpholoom
      dockerfile: Dockerfile
    container_name: morpholoom-app
    working_dir: /app
    volumes:
      - ./storage:/app/src/storage
      - ./Morpholoom:/app/src
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "18080:8080"
      - "18888:8888"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/morpholoom
      SPRING_DATASOURCE_USERNAME: morpholoom
      SPRING_DATASOURCE_PASSWORD: morpholoom123!
    command: ["bash"]
    tty: true      
    # command: >
    #   sh -c "
    #     chmod +x ./mvnw && 
    #     ./mvnw clean install -DskipTests && 
    #     java -jar target/morpholoom-0.0.1-SNAPSHOT.jar
    #   "
    networks:
      - morpholoom-network

  # LivePortrait Python 애플리케이션
  liveportrait:
    build:
      context: ./LivePortrait
      dockerfile: Dockerfile
    container_name: liveportrait-app
    volumes:
      - ./LivePortrait:/app
      - ./LivePortrait/pretrained_weights:/app/pretrained_weights
      - ./storage/user/images:/app/assets/examples/source
      - ./storage/user/videos:/app/assets/examples/driving
      - ./storage/user/results:/app/animations

    ports:
      - "17860:7860"
    # command: ["python", "app.py", "--server_name", "0.0.0.0", "--server_port", "7860", "--flag_force_cpu"]
    command: ["bash"]
    tty: true
    gpus: all
    networks:
      - morpholoom-network

  # Keycloak 인증 서버
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.7
    container_name: morpholoom-keycloak
    restart: always
    command:
      - start-dev
      - --http-port=8081
    environment:
      # 데이터베이스 설정
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: morpholoom
      KC_DB_PASSWORD: morpholoom123!
      # 관리자 계정
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin123!
      # 호스트 설정
      # KC_HOSTNAME: http://10.10.110.29
      # KC_HOSTNAME_PORT: 18081
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_HTTP_ENABLED: true
      # 로그 설정
      KC_LOG_LEVEL: info
    ports:
      - "18081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - keycloak_data:/opt/keycloak/data
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8081;echo -e 'GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n' >&3;if [ $? -eq 0 ]; then echo 'Healthcheck Successful';exit 0;else echo 'Healthcheck Failed';exit 1;fi;"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - morpholoom-network

volumes:
  postgres_data:
  morpholoom_storage:
  liveportrait_weights:
  liveportrait_output:
  keycloak_data:

networks:
  morpholoom-network:
    driver: bridge

